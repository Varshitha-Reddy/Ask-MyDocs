version: "3.9"

services:
  # Elasticsearch: handles keyword (BM25) search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node        # Run as a single node (fine for dev/demo)
      - xpack.security.enabled=false      # No auth needed locally
      - ES_JAVA_OPTS=-Xms512m -Xmx512m   # Limit memory usage
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis: caches search results so repeated queries are instant
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FastAPI backend
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker — picks up ingestion tasks from Redis queue and runs them.
  # Runs in a separate process so it survives FastAPI restarts and vice versa.
  # Scale workers by adding: docker compose up --scale celery_worker=3
  celery_worker:
    build: ./backend
    env_file: .env
    # This command starts the Celery worker (not the FastAPI server)
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Flower — web UI to monitor Celery tasks at http://localhost:5555
  # Shows: pending tasks, running tasks, completed tasks, retries, failures
  flower:
    build: ./backend
    env_file: .env
    command: celery -A app.core.celery_app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - celery_worker

  # React frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  es_data:
