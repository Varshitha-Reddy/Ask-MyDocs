# Optional nginx reverse proxy — routes /api/* to backend, everything else to frontend.
# Useful for production so both services share one domain and port.

events {}

http {
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:5173; }

    server {
        listen 80;

        # API traffic goes to FastAPI
        location /api/ {
            proxy_pass         http://backend/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Everything else goes to the React app
        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host $host;
        }
    }
}
